# compose.yaml para MesaTech Cloud - RabbitMQ Broker (EC2 C)
# Evaluación Parcial 2 - DSY1107 - Desarrollo Cloud Native I
# Integrantes: Francisco Torres — Kevin Mesías
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: mesatech-rabbitmq
    hostname: rabbitmq.mesatech.internal
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5672:5672"      # Puerto AMQP para microservicios
      - "15672:15672"    # Puerto HTTP para panel web de administración
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
    name: mesatech_rabbitmq_data
