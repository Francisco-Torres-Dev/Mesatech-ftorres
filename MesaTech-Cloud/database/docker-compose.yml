version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: mesatech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mesatech
      POSTGRES_USER: mesatech
      POSTGRES_PASSWORD: mesatech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
