      resourceserver:
        jwt:
          issuer-uri: "https://login.microsoftonline.com/2b28c657-3169-48ee-91b9-d36cede4fe70/v2.0"
          jwk-set-uri: "https://login.microsoftonline.com/2b28c657-3169-48ee-91b9-d36cede4fe70/discovery/v2.0/keys"
